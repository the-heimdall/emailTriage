# The name shown on the Actions tab and on pull requests.
name: ci

# When to run: on every pull request, and on every push to main.
on:
  pull_request:
  push:
    branches: [main]

# This workflow only needs to read the code.
permissions:
  contents: read

jobs:
  # "check" is the name you will require in the branch rule.
  check:
    # A fresh Linux machine from GitHub, thrown away afterwards.
    # Pinned rather than ubuntu-latest, so the OS only changes when we change it here.
    runs-on: ubuntu-26.04
    steps:
      # Download your code onto the machine.
      - name: Check out the code
        uses: actions/checkout@v5

      # Install Node 24, the same version Lambda runs.
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run unit, API and adapter tests
        run: npm test

      # Exact versions from web/package-lock.json, so every run uses the same packages.
      - name: Install dashboard dependencies
        run: npm ci --prefix web

      # Proves the React dashboard still builds.
      - name: Build the dashboard
        run: npm --prefix web run build

      # v3 runs on Node 24 and passes the job's token by default, which avoids
      # GitHub's rate limit.
      - name: Install the SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      # Checks the template locally. No AWS login needed.
      - name: Validate the SAM template
        run: sam validate --lint --region eu-west-2
